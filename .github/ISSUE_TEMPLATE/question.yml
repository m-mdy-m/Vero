name: Question
description: Ask a question about the project
title: "[Question]: "
labels: ["question"]
assignees:
  - m-mdy-m

body:
  - type: markdown
    attributes:
      value: |
        Have a question? We're here to help!

  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: What would you like to know?
      placeholder: Ask your question here
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: What is this about?
      options:
        - Setup/Installation
        - Usage/How-to
        - Architecture/Design
        - API/Integration
        - Contribution
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any relevant background information

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I've searched existing issues
          required: true
        - label: I've checked the documentation
          required: true